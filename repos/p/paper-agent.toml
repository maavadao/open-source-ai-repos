name = "Paper-Agent"
description = "Paper-Agent 是一个面向科研人员和学生的智能论文检索与调研工具。项目基于多智能体协作架构（LangGraph），通过自然语言处理（NLP）、自动化搜索，帮助用户高效查找学术论文、分析文献内容，并进行论文调研。Paper-Agent 支持多平台集成、关键词搜索、自动分析、论文调研，提升了学术研究的效率。适用于论文写作、学术调研、科研项目管理等多种场景，是学术调研的理想助手。"
category = "agents"
tags = ["agent", "agents", "ai", "autogen", "chroma", "langchain", "llm", "multi-agent"]
repository = "https://github.com/Tswoen/Paper-Agent"
language = "Python"

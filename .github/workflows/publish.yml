name: Publish index

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"  # daily, so stars and last activity stay fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_index.py
      - name: Build contributors
        # Never hold up the repos index; the developer pages keep their last published data.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the daily run asks GitHub for contributors; merges reuse the last published
          # file, with opt-outs applied straight away.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/build_contributors.py
          else
            python scripts/build_contributors.py --reuse https://maavadao.github.io/open-source-ai-repos/contributors.json
          fi
      - name: Build star history
        # Adds today's stars to every repo's history, keeping what's already published.
        continue-on-error: true
        run: python scripts/build_history.py --previous https://maavadao.github.io/open-source-ai-repos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

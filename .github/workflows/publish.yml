name: Publish index

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"  # daily, so stars and last activity stay fresh
  workflow_dispatch:
    inputs:
      seed_url:
        description: "Contributors file to start from instead of the published one (for a first full build)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_index.py
      - name: Build contributors
        # Never hold up the repos index; the developer pages keep their last published data.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_URL: ${{ inputs.seed_url }}
        run: |
          # Only the daily run asks GitHub for contributors, and only for a slice of the repos
          # (the Actions token allows about 1,000 calls an hour); the rest comes from the last
          # published file. Merges reuse that file, with opt-outs applied straight away.
          PUBLISHED=https://maavadao.github.io/open-source-ai-repos/contributors.json
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/build_contributors.py --reuse "$PUBLISHED"
          else
            python scripts/build_contributors.py --top 100000 --refresh 900 \
              --previous "${SEED_URL:-$PUBLISHED}"
          fi
      - name: Build star history
        # Adds today's stars to every repo's history, keeping what's already published.
        continue-on-error: true
        run: python scripts/build_history.py --previous https://maavadao.github.io/open-source-ai-repos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
